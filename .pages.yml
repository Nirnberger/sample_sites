# Pages CMS (https://pagescms.org) – Formulare zum Pflegen der Website-Inhalte ohne JSON.
# Jeder Menüpunkt bearbeitet einen Teil derselben Inhaltsdatei. Mit content.merge bleiben alle
# Felder erhalten, die hier nicht stehen; Listen werden beim Speichern aber komplett ersetzt –
# deshalb sind bei Listen ALLE Unterfelder definiert (technische davon versteckt).
# Fotos werden nicht hier hochgeladen (sie liegen im Objektspeicher, siehe HOSTING.md); in den
# Formularen wählt man nur aus, welches vorhandene Foto wo erscheint.
# Jede Änderung wird ein Commit auf main → Pipeline prüft → Website ist nach wenigen Minuten aktuell.

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      update: "CMS: {name} geändert von {userName}"

content:
  - name: nora-solcher
    label: Website Nora Solcher
    type: group
    items:

      - name: nora-start
        label: Startseite & Über mich
        description: Startbereich, Biografie, Pressezitat und Auszeichnungen.
        type: file
        path: kunden/nora-solcher/schauspiel.json
        format: json
        fields:
          - name: farbschema
            label: Farbschema (von coolors.co)
            description: "Auf coolors.co Palette → Export → Code kopieren und hier einfügen (jedes Format geht, auch der Link). Leer = Standardfarben. Hellste Farbe = Hintergrund, dunkelste = Schrift, kräftigste = Akzent. Vorher ausprobieren: Website-Adresse mit #farben am Ende öffnen."
            type: text
          - name: hero_text
            label: Einleitung im Startbereich
            type: text
          - name: hero_bild
            label: Foto im Startbereich
            type: object
            fields:
              - name: datei
                label: Foto
                type: select
                options:
                  values: [hero.jpg, portrait.jpg, portrait-dunkel.jpg, portrait-farbe.jpg, portrait-hocker.jpg, portrait-lachend.jpg, portrait-profil.jpg, portrait-schulter.jpg, portrait-sofa.jpg, portrait-street.jpg, portrait-sw.jpg, szene-hertopia-1.jpg, szene-hertopia-2.jpg, szene-wintermaerchen-1.jpg, szene-wintermaerchen-2.jpg, szene-wintermaerchen-3.jpg]
              - name: alt
                label: Beschreibung (für blinde Menschen und Google)
                type: string
              - name: fokus
                label: Bildausschnitt (technisch)
                type: string
                hidden: true
              - name: credit
                label: Foto von
                type: string
          - name: ueber_mich
            label: Text „Über Nora“
            description: Absätze durch eine Leerzeile trennen.
            type: text
          - name: ueber_mich_bild
            label: Foto bei „Über Nora“
            type: object
            fields:
              - name: datei
                label: Foto
                type: select
                options:
                  values: [hero.jpg, portrait.jpg, portrait-dunkel.jpg, portrait-farbe.jpg, portrait-hocker.jpg, portrait-lachend.jpg, portrait-profil.jpg, portrait-schulter.jpg, portrait-sofa.jpg, portrait-street.jpg, portrait-sw.jpg, szene-hertopia-1.jpg, szene-hertopia-2.jpg, szene-wintermaerchen-1.jpg, szene-wintermaerchen-2.jpg, szene-wintermaerchen-3.jpg]
              - name: alt
                label: Beschreibung (für blinde Menschen und Google)
                type: string
              - name: fokus
                label: Bildausschnitt (technisch)
                type: string
                hidden: true
              - name: credit
                label: Foto von
                type: string
          - name: zitat
            label: Pressezitat
            type: object
            fields:
              - name: text
                label: Zitat (ohne Anführungszeichen)
                type: text
              - name: quelle
                label: Quelle
                type: string
          - name: auszeichnungen
            label: Auszeichnungen
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{jahr} {titel}"
            fields:
              - { name: jahr, label: Jahr, type: string }
              - { name: titel, label: Preis, type: string, required: true }
              - { name: text, label: "Zusatz (z. B. für „Hertopia“)", type: string }
          - name: kurzbeschreibung
            label: Kurzbeschreibung für Google (max. 160 Zeichen)
            type: text

      - name: nora-v1
        label: "Erste Fassung (/nora-solcher/v1/): Farbschema"
        description: Die erste Fassung ist eingefroren – nur das Farbschema lässt sich hier ändern.
        type: file
        path: kunden/nora-solcher/v1.json
        format: json
        fields:
          - name: farbschema
            label: Farbschema (von coolors.co)
            description: "Auf coolors.co Palette → Export → Code kopieren und hier einfügen (jedes Format geht, auch der Link). Leer = Standardfarben. Dunkelste Farbe = Bühne, hellste = Papier, kräftigste = Vorhang. Vorher ausprobieren: Website-Adresse mit #farben am Ende öffnen."
            type: text

      - name: nora-aktuell
        label: Neuigkeiten
        type: file
        path: kunden/nora-solcher/schauspiel.json
        format: json
        fields:
          - name: aktuell
            label: Neuigkeiten (Startseite)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}: {titel}"
            fields:
              - { name: label, label: "Art (z. B. Hörspiel)", type: string }
              - { name: titel, label: Überschrift, type: string, required: true }
              - { name: text, label: Text, type: text }
              - name: bereich
                label: Verlinkt auf Seite
                type: select
                options:
                  values: [theater, film, audio, schreiben, unterrichten]

      - name: nora-bereiche
        label: "Seiten: Theater, Film, Audio, Schreiben, Unterrichten"
        description: Jede Seite hat Einleitung, Foto und Listen mit Arbeiten. Die Reihenfolge hier ist die Reihenfolge im Menü.
        type: file
        path: kunden/nora-solcher/schauspiel.json
        format: json
        fields:
          - name: bereiche
            label: Seiten
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{titel}"
            fields:
              - { name: id, label: Adresse (technisch), type: string, hidden: true }
              - { name: titel, label: Name im Menü, type: string, required: true }
              - { name: untertitel, label: Untertitel, type: string }
              - { name: teaser, label: Kurztext auf der Startseite, type: text }
              - { name: intro, label: Einleitung oben auf der Seite, type: text }
              - name: bild
                label: Foto oben auf der Seite
                type: object
                fields:
                  - name: datei
                    label: Foto
                    type: select
                    options:
                      values: [hero.jpg, portrait.jpg, portrait-dunkel.jpg, portrait-farbe.jpg, portrait-hocker.jpg, portrait-lachend.jpg, portrait-profil.jpg, portrait-schulter.jpg, portrait-sofa.jpg, portrait-street.jpg, portrait-sw.jpg, szene-hertopia-1.jpg, szene-hertopia-2.jpg, szene-wintermaerchen-1.jpg, szene-wintermaerchen-2.jpg, szene-wintermaerchen-3.jpg]
                  - name: alt
                    label: Beschreibung (für blinde Menschen und Google)
                    type: string
                  - name: fokus
                    label: Bildausschnitt (technisch)
                    type: string
                    hidden: true
                  - name: credit
                    label: Foto von
                    type: string
              - name: gruppen
                label: Listen (z. B. Hörspiel, Hörbuch …)
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{titel}"
                fields:
                  - { name: titel, label: Überschrift, type: string, required: true }
                  - name: darstellung
                    label: Darstellung
                    type: select
                    options:
                      values:
                        - { name: liste, label: Liste }
                        - { name: projekte, label: Große Projektkarten (wie bei Film) }
                  - name: eintraege
                    label: Arbeiten
                    type: object
                    list:
                      collapsible:
                        collapsed: true
                        summary: "{jahr} {titel}"
                    fields:
                      - { name: jahr, label: Jahr, type: string }
                      - { name: titel, label: Titel, type: string, required: true }
                      - { name: rolle, label: Rolle / Funktion, type: string }
                      - { name: regie, label: Regie, type: string }
                      - { name: ort, label: Haus / Sender / Produktion, type: string }
                      - { name: text, label: Kurzbeschreibung, type: text }
                      - { name: auszeichnung, label: Auszeichnung, type: string }
                      - { name: art, label: "Format (nur Projektkarten, z. B. Kinofilm)", type: string }
                      - { name: rollentyp, label: "Rollengröße (nur Projektkarten, z. B. Hauptrolle)", type: string }
                      - { name: ausstrahlung, label: Ausstrahlung (nur Projektkarten), type: string }
              - { name: hinweis, label: Hinweis unter der letzten Liste, type: text }
              - { name: angebote_titel, label: Überschrift der Angebote (nur Unterrichten), type: string }
              - name: angebote
                label: Angebote (nur Unterrichten)
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{titel}"
                fields:
                  - { name: titel, label: Angebot, type: string, required: true }
                  - { name: text, label: Beschreibung, type: text }
              - { name: hervorhebung, label: Hervorgehobener Satz (nur Unterrichten), type: text }
              - name: zitat
                label: Zitat
                type: object
                fields:
                  - name: text
                    label: Zitat (ohne Anführungszeichen)
                    type: text
                  - name: quelle
                    label: Quelle
                    type: string
              - name: fotos
                label: Szenenfotos
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{alt}"
                fields:
                  - name: datei
                    label: Foto
                    type: select
                    required: true
                    options:
                      values: [hero.jpg, portrait.jpg, portrait-dunkel.jpg, portrait-farbe.jpg, portrait-hocker.jpg, portrait-lachend.jpg, portrait-profil.jpg, portrait-schulter.jpg, portrait-sofa.jpg, portrait-street.jpg, portrait-sw.jpg, szene-hertopia-1.jpg, szene-hertopia-2.jpg, szene-wintermaerchen-1.jpg, szene-wintermaerchen-2.jpg, szene-wintermaerchen-3.jpg]
                  - { name: alt, label: Beschreibung (für blinde Menschen und Google), type: string }
                  - { name: credit, label: Foto von, type: string }
              - name: medien
                label: Showreels & Hörproben (Links)
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{titel}"
                fields:
                  - { name: titel, label: Titel, type: string, required: true }
                  - { name: text, label: Beschreibung, type: string }
                  - name: url
                    label: Link
                    type: string
                    required: true
                    pattern:
                      regex: "^https://"
                      message: Der Link muss mit https:// beginnen.
                  - name: art
                    label: Art
                    type: select
                    options:
                      values:
                        - { name: video, label: Video }
                        - { name: audio, label: Audio }

      - name: nora-fotos
        label: Fotogalerie (Startseite)
        description: Neue Fotos bitte an Philipp schicken – sie werden im Speicher abgelegt und erscheinen dann hier in der Auswahl.
        type: file
        path: kunden/nora-solcher/schauspiel.json
        format: json
        fields:
          - name: galerie
            label: Fotos
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{alt}"
            fields:
              - name: datei
                label: Foto
                type: select
                required: true
                options:
                  values: [hero.jpg, portrait.jpg, portrait-dunkel.jpg, portrait-farbe.jpg, portrait-hocker.jpg, portrait-lachend.jpg, portrait-profil.jpg, portrait-schulter.jpg, portrait-sofa.jpg, portrait-street.jpg, portrait-sw.jpg, szene-hertopia-1.jpg, szene-hertopia-2.jpg, szene-wintermaerchen-1.jpg, szene-wintermaerchen-2.jpg, szene-wintermaerchen-3.jpg]
              - { name: alt, label: Beschreibung (für blinde Menschen und Google), type: string }
              - { name: credit, label: Foto von, type: string }

      - name: nora-kontakt
        label: Kontakt, Casting-Angaben & Rechtliches
        type: file
        path: kunden/nora-solcher/schauspiel.json
        format: json
        fields:
          - name: kontakt
            label: Kontakt
            type: object
            fields:
              - name: text
                label: Einleitungstext
                type: text
              - name: email_direkt
                label: Eigene E-Mail (für Unterricht & Kooperationen; leer = Management)
                type: string
                pattern:
                  regex: "^$|^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
                  message: Bitte eine gültige E-Mail-Adresse eingeben.
              - name: agentur
                label: Management
                type: object
                fields:
                  - { name: name, label: Name, type: string }
                  - { name: person, label: Ansprechperson, type: string }
                  - { name: telefon, label: Telefon, type: string }
                  - { name: email, label: E-Mail, type: string }
                  - name: website
                    label: Website
                    type: string
                    pattern:
                      regex: "^$|^https?://"
                      message: Der Link muss mit https:// beginnen.
              - name: anliegen
                label: Anliegen (Karten auf der Kontaktseite)
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{titel}"
                fields:
                  - { name: titel, label: Anliegen, type: string, required: true }
                  - { name: text, label: Beschreibung, type: text }
                  - name: weg
                    label: E-Mail geht an
                    type: select
                    options:
                      values:
                        - { name: agentur, label: Management }
                        - { name: direkt, label: Nora direkt }
                  - { name: hilfreich, label: Hilfreich für die Anfrage, type: string }
          - name: steckbrief
            label: Casting-Angaben („Auf einen Blick“)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}: {wert}"
            fields:
              - { name: label, label: Merkmal, type: string, required: true }
              - { name: wert, label: Angabe, type: string, required: true }
          - name: profile
            label: Profile (Instagram, Filmmakers …)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{name}"
            fields:
              - { name: name, label: Name, type: string, required: true }
              - name: url
                label: Link
                type: string
                required: true
                pattern:
                  regex: "^https://"
                  message: Der Link muss mit https:// beginnen.
          - name: impressum
            label: Impressum
            description: "Überschriften mit ## am Zeilenanfang."
            type: text
          - name: datenschutz
            label: Datenschutzerklärung
            description: "Überschriften mit ## am Zeilenanfang."
            type: text
