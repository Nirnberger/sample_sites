# Pages CMS (https://pagescms.org) – Formulare zum Pflegen der Website-Inhalte ohne JSON.
# Jeder Menüpunkt bearbeitet einen Teil derselben Inhaltsdatei. Mit content.merge bleiben alle
# Felder erhalten, die hier nicht stehen; Listen werden beim Speichern aber komplett ersetzt –
# deshalb sind bei Listen ALLE Unterfelder definiert (technische davon versteckt).
# Fotos werden nicht hier hochgeladen (sie liegen im Objektspeicher, siehe HOSTING.md); in den
# Formularen wählt man nur aus, welches vorhandene Foto wo erscheint.
# Jede Änderung wird ein Commit auf main → Pipeline prüft → Website ist nach wenigen Minuten aktuell.

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      update: "CMS: {name} geändert von {userName}"

content:
  - name: nora-solcher
    label: Website Nora Solcher
    type: group
    items:

      - name: nora-start
        label: Startseite
        description: Großer Startbereich, Leitsatz und Pressezitat.
        type: file
        path: kunden/nora-solcher/schauspiel.json
        format: json
        fields:
          - name: hero_rollen
            label: Wechselnde Rollen im Startbereich
            description: Erscheinen nacheinander unter dem Namen, jeweils mit einem Porträt.
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{verb} {rolle}"
            fields:
              - name: verb
                label: Tätigkeit
                type: select
                options:
                  values: [spielt, spricht, ist, singt, liest]
              - name: rolle
                label: Rolle
                type: string
                required: true
              - name: werk
                label: Stück / Produktion
                description: z. B. „Dead vs. Alive“ · Schauspiel Frankfurt
                type: string
              - name: bild
                label: Foto
                type: select
                options:
                  values: [hero.jpg, portrait.jpg, portrait-dunkel.jpg, portrait-farbe.jpg, portrait-hocker.jpg, portrait-lachend.jpg, portrait-profil.jpg, portrait-schulter.jpg, portrait-sofa.jpg, portrait-street.jpg, portrait-sw.jpg, szene-hertopia-1.jpg, szene-hertopia-2.jpg, szene-wintermaerchen-1.jpg, szene-wintermaerchen-2.jpg, szene-wintermaerchen-3.jpg]
          - name: hero_zeile
            label: Unterzeile (für Suchmaschinen und Vorschauen)
            type: string
          - name: prolog
            label: Leitsatz (groß im Abschnitt „Prolog“)
            type: text
          - name: zitat
            label: Pressezitat
            type: object
            fields:
              - name: text
                label: Zitat (ohne Anführungszeichen)
                type: text
              - name: quelle
                label: Quelle
                type: string
          - name: kurzbeschreibung
            label: Kurzbeschreibung für Google (max. 160 Zeichen)
            type: text

      - name: nora-ueber-mich
        label: Über mich & Preise
        type: file
        path: kunden/nora-solcher/schauspiel.json
        format: json
        fields:
          - name: ueber_mich
            label: Text „Über mich“
            description: Absätze durch eine Leerzeile trennen. Der erste Absatz erscheint größer.
            type: text
          - name: ueber_mich_fakten
            label: Kennzahlen
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{wert} – {text}"
            fields:
              - name: wert
                label: Zahl / Wert (z. B. 15+)
                type: string
              - name: text
                label: Bedeutung
                type: string
          - name: auszeichnungen
            label: Auszeichnungen („Applaus“)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{jahr} · {titel}"
            fields:
              - name: jahr
                label: Jahr
                type: string
              - name: titel
                label: Preis
                type: string
                required: true
              - name: text
                label: Zusatz (z. B. für „Hertopia“)
                type: string

      - name: nora-aktuell
        label: Neuigkeiten
        description: Die ersten Einträge erscheinen unter „Zuletzt“. Neueste nach oben ziehen.
        type: file
        path: kunden/nora-solcher/schauspiel.json
        format: json
        fields:
          - name: aktuell
            label: Neuigkeiten
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}: {titel}"
            fields:
              - name: label
                label: Art
                type: select
                options:
                  values: [Theater, Film, Fernsehen, Hörspiel, Hörbuch, Lesung, Auszeichnung, Premiere, Termin]
              - name: titel
                label: Überschrift
                type: string
                required: true
              - name: text
                label: Text
                type: text
              - name: bild
                label: Bild (technisch)
                type: object
                hidden: true
                fields:
                  - { name: datei, label: Datei, type: string }
                  - { name: alt, label: Beschreibung, type: string }
                  - { name: credit, label: Foto von, type: string }

      - name: nora-vita
        label: Vita (Bühne, Kamera, Stimme, Feder)
        description: Je Bereich eine Liste. Neueste Arbeiten nach oben ziehen.
        type: file
        path: kunden/nora-solcher/schauspiel.json
        format: json
        fields:
          - name: vita
            label: Bereiche
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{kategorie}"
            fields:
              - name: kategorie
                label: Bereich
                type: string
                required: true
              - name: akt
                label: Darstellung
                type: object
                fields:
                  - name: intro
                    label: Einleitungstext des Bereichs
                    type: text
                  - { name: nr, label: Akt-Nummer, type: string, hidden: true }
                  - { name: titel, label: Akt-Titel, type: string, hidden: true }
                  - { name: stil, label: Stil, type: string, hidden: true }
                  - { name: gehoert_zu, label: Gehört zu, type: string, hidden: true }
              - name: eintraege
                label: Arbeiten
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{jahr} · {titel}"
                fields:
                  - name: jahr
                    label: Jahr
                    description: z. B. 2024 oder 2022–25
                    type: string
                  - name: titel
                    label: Titel
                    type: string
                    required: true
                  - name: rolle
                    label: Rolle / Funktion
                    type: string
                  - name: regie
                    label: Regie
                    type: string
                  - name: ort
                    label: Haus / Sender / Ort
                    type: string
                  - name: auszeichnung
                    label: Auszeichnung (erscheint als Stempel)
                    type: string

      - name: nora-profil
        label: Profil & Fähigkeiten
        type: file
        path: kunden/nora-solcher/schauspiel.json
        format: json
        fields:
          - name: steckbrief
            label: Besetzungszettel
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}: {wert}"
            fields:
              - name: label
                label: Merkmal
                type: string
                required: true
              - name: wert
                label: Angabe
                type: string
                required: true
          - name: register
            label: Laufbänder (Sprachen, Körper, Klang …)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{gruppe}"
            fields:
              - name: gruppe
                label: Überschrift
                type: string
                required: true
              - name: werte
                label: Begriffe
                type: string
                list: true

      - name: nora-medien
        label: Showreels & Profile
        type: file
        path: kunden/nora-solcher/schauspiel.json
        format: json
        fields:
          - name: medien
            label: Showreels und Hörproben (Links)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{titel}"
            fields:
              - name: titel
                label: Titel
                type: string
                required: true
              - name: text
                label: Beschreibung
                type: string
              - name: url
                label: Link
                type: string
                required: true
                pattern:
                  regex: "^https://"
                  message: Der Link muss mit https:// beginnen.
              - name: art
                label: Art
                type: select
                options:
                  values:
                    - { name: video, label: Video }
                    - { name: audio, label: Audio }
          - name: profile
            label: Profile (Instagram, Filmmakers …)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{name}"
            fields:
              - name: name
                label: Name
                type: string
                required: true
              - name: url
                label: Link
                type: string
                required: true
                pattern:
                  regex: "^https://"
                  message: Der Link muss mit https:// beginnen.

      - name: nora-fotos
        label: Fotos (Auswahl & Beschriftung)
        description: Neue Fotos bitte an Philipp schicken – sie werden im Speicher abgelegt und erscheinen dann hier in der Auswahl.
        type: file
        path: kunden/nora-solcher/schauspiel.json
        format: json
        fields:
          - name: galerie
            label: Kontaktbogen
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{alt}"
            fields:
              - name: datei
                label: Foto
                type: select
                required: true
                options:
                  values: [hero.jpg, portrait.jpg, portrait-dunkel.jpg, portrait-farbe.jpg, portrait-hocker.jpg, portrait-lachend.jpg, portrait-profil.jpg, portrait-schulter.jpg, portrait-sofa.jpg, portrait-street.jpg, portrait-sw.jpg, szene-hertopia-1.jpg, szene-hertopia-2.jpg, szene-wintermaerchen-1.jpg, szene-wintermaerchen-2.jpg, szene-wintermaerchen-3.jpg]
              - name: alt
                label: Beschreibung (für blinde Menschen und Google)
                type: string
              - name: credit
                label: Foto von
                type: string
              - name: markiert
                label: Mit Rotstift einkreisen (Favorit)
                type: boolean

      - name: nora-kontakt
        label: Kontakt & Rechtliches
        type: file
        path: kunden/nora-solcher/schauspiel.json
        format: json
        fields:
          - name: kontakt
            label: Kontakt
            type: object
            fields:
              - name: text
                label: Einleitungstext
                type: text
              - name: email_direkt
                label: Eigene E-Mail (leer = Agentur)
                type: string
                pattern:
                  regex: "^$|^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
                  message: Bitte eine gültige E-Mail-Adresse eingeben.
              - name: agentur
                label: Agentur
                type: object
                fields:
                  - { name: name, label: Name, type: string }
                  - { name: person, label: Ansprechperson, type: string }
                  - { name: telefon, label: Telefon, type: string }
                  - { name: email, label: E-Mail, type: string }
                  - name: website
                    label: Website
                    type: string
                    pattern:
                      regex: "^$|^https?://"
                      message: Der Link muss mit https:// beginnen.
          - name: impressum
            label: Impressum
            description: "Überschriften mit ## am Zeilenanfang."
            type: text
          - name: datenschutz
            label: Datenschutzerklärung
            description: "Überschriften mit ## am Zeilenanfang."
            type: text
