# Gemeinsame Regeln für Dateien – eingebunden in den Hauptserver (nginx.conf) und in die
# Serverblöcke eigener Domains (von build-all.js erzeugt, siehe "domain" in sites.json).

# Bilder, Schriften, JS: Dateinamen ändern sich bei neuem Inhalt selten → 7 Tage cachen
location ~* \.(avif|webp|jpg|jpeg|png|svg|woff2|js)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public";
    include /etc/nginx/snippets/sicherheit.conf;
}

# Showreels, Hörproben (aus kunden/<pfad>/medien/): 7 Tage cachen, Teilabrufe (Spulen) erlaubt nginx von selbst
location ~* \.(mp4|webm|mp3|m4a|ogg|opus|vtt|pdf)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public";
    include /etc/nginx/snippets/sicherheit.conf;
}

# HTML immer frisch, damit Änderungen nach einem Deploy sofort sichtbar sind
location ~* \.html$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/sicherheit.conf;
}

error_page 404 /404.html;
location = /404.html {
    internal;
    return 404 "Seite nicht gefunden\n";
}
