# nginx für alle Seiten unter einer Domain: /<pfad>/ → public/<pfad>/
# Coolify (Traefik) übernimmt HTTPS und leitet auf Port 80 dieses Containers weiter.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Weiterleitungen relativ halten (sonst landet man hinter dem Proxy auf http://…:80)
    absolute_redirect off;
    server_tokens off;
    # Keine Verzeichnislisten, keine versteckten Dateien (.git, .env …)
    autoindex off;
    location ~ /\. { return 404; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;

    include /etc/nginx/snippets/sicherheit.conf;

    # Startseite (/) = Hub mit den Beispielprojekten aus sites.json (nur Einträge mit "hub").
    # Kunden-Demos ohne "hub"-Eintrag sind dort nicht verlinkt.

    # /petri-pirsch → /petri-pirsch/ (wichtig: alle Pfade in den Seiten sind relativ)
    location ~ ^/([a-z0-9-]+)$ {
        return 301 /$1/;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Bilder, Schriften, JS: Dateinamen ändern sich bei neuem Inhalt selten → 7 Tage cachen
    location ~* \.(webp|jpg|jpeg|png|svg|woff2|js)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/sicherheit.conf;
    }

    # HTML immer frisch, damit Änderungen nach einem Deploy sofort sichtbar sind
    location ~* \.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/sicherheit.conf;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        return 404 "Seite nicht gefunden\n";
    }
}
