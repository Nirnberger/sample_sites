# nginx für alle Seiten unter einer Domain: /<pfad>/ → public/<pfad>/
# Coolify (Traefik) übernimmt HTTPS und leitet auf Port 80 dieses Containers weiter.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Weiterleitungen relativ halten (sonst landet man hinter dem Proxy auf http://…:80)
    absolute_redirect off;
    server_tokens off;
    # Keine Verzeichnislisten, keine versteckten Dateien (.git, .env …)
    autoindex off;
    location ~ /\. { return 404; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;

    include /etc/nginx/snippets/sicherheit.conf;

    # Startseite (/) = Hub mit den Beispielprojekten aus sites.json (nur Einträge mit "hub").
    # Kunden-Demos ohne "hub"-Eintrag sind dort nicht verlinkt.

    # /petri-pirsch → /petri-pirsch/, /nora-solcher/v2 → /nora-solcher/v2/
    # (wichtig: alle Pfade in den Seiten sind relativ)
    location ~ ^/([a-z0-9-]+(/[a-z0-9-]+)*)$ {
        return 301 /$1/;
    }

    # Noras Website gibt es in zwei Fassungen (/nora-solcher/v1/ und /v2/) – bisherige Links führen zur neuen
    location = /nora-solcher/ {
        return 302 /nora-solcher/v2/;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Caching, HTML ohne Cache, 404 – gemeinsam mit den Serverblöcken eigener Domains
    include /etc/nginx/snippets/dateien.conf;
}
