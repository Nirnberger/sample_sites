# Sicherheits-Header – in JEDEM location-Block mit eigenem add_header einbinden
# (nginx erbt add_header nicht, sobald ein Block eigene add_header-Zeilen hat).
#
# Content-Security-Policy: Skripte, Schriften, Bilder nur von dieser Domain. Da alle Kundenseiten
# unter einer Domain laufen, verhindert das, dass eingeschleuster Code andere Seiten beeinflusst.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
